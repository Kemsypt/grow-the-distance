name: Publish Grow the Distance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - name: Extract game source
        working-directory: .
        run: unzip -q source.zip -d app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build browser game
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          flutter build web --release --no-web-resources-cdn --base-href "${PAGES_BASE_PATH%/}/" --output dist
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
